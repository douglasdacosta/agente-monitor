<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de execução</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-project-manager" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9zM9 11h6M9 15h4"/></symbol>
    <symbol id="i-designer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></symbol>
    <symbol id="i-developer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
    <symbol id="i-tech-lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="12" cy="19" r="2.5"/><path d="M6 7.5v1.5a3 3 0 003 3h6a3 3 0 003-3V7.5M12 12v4.5"/></symbol>
    <symbol id="i-dev-backend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
    <symbol id="i-dev-frontend" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></symbol>
    <symbol id="i-qa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-outro" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-ampulheta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12M6 22h12M7 2c0 6 10 6 10 10S7 16 7 22M17 2c0 6-10 6-10 10s10 4 10 10"/></symbol>
    <symbol id="i-voltou" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
    <symbol id="i-fechar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-vazio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h3a2 2 0 012 2v5"/></symbol>
    <symbol id="i-erro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></symbol>
  </defs>
</svg>

<header>
  <h1>Monitor de execução</h1>
  <div class="campo">
    <label for="sessao">Sessão</label>
    <div class="campo-linha">
      <select id="sessao"></select>
      <button type="button" class="link-nova" id="nova-sessao">Nova sessão · ver</button>
    </div>
  </div>
  <button type="button" class="switch" id="toggle-outros" role="switch" aria-checked="false" aria-disabled="true" title="Nenhum agente fora do time nesta sessão">
    <span class="trilho" aria-hidden="true"></span><span id="toggle-txt">Ocultar outros (0)</span>
  </button>
  <span class="chip-fixture" id="chip-fixture"></span>
  <div class="espaco"></div>
  <div id="conexao" class="conexao reconectando" role="status" aria-live="polite"><span class="ponto" aria-hidden="true"></span><span id="conexao-txt">Reconectando…</span></div>
  <div class="total" title="Do primeiro início ao último término">
    <span class="rotulo">Duração total</span>
    <span class="valor" id="total" role="timer" aria-live="off">--:--</span>
  </div>
</header>
<div class="faixa-erro" id="faixa-erro" role="alert">
  Sem conexão com o servidor. Os dados podem estar desatualizados; os timers seguem contando localmente.
  <button type="button" class="btn peq" id="reconectar">Reconectar</button>
</div>

<div class="legenda" aria-label="Legenda">
  <span><svg width="28" height="10" aria-hidden="true"><line x1="0" y1="5" x2="20" y2="5" stroke="#64748B" stroke-width="2"/><path d="M19,1 L27,5 L19,9z" fill="#64748B"/></svg>Avanço</span>
  <span><svg width="28" height="10" aria-hidden="true"><line x1="0" y1="5" x2="20" y2="5" stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M19,1 L27,5 L19,9z" fill="#B91C1C"/></svg>Voltou</span>
  <span style="color:var(--pm)"><svg class="ic" aria-hidden="true"><use href="#i-project-manager"/></svg><span style="color:var(--text-muted)">PM</span></span>
  <span style="color:var(--des)"><svg class="ic" aria-hidden="true"><use href="#i-designer"/></svg><span style="color:var(--text-muted)">Designer</span></span>
  <span style="color:var(--tl)"><svg class="ic" aria-hidden="true"><use href="#i-tech-lead"/></svg><span style="color:var(--text-muted)">Tech Lead</span></span>
  <span data-papel="developer" hidden style="color:var(--dev)"><svg class="ic" aria-hidden="true"><use href="#i-developer"/></svg><span style="color:var(--text-muted)">Desenvolvedor</span></span>
  <span style="color:var(--be)"><svg class="ic" aria-hidden="true"><use href="#i-dev-backend"/></svg><span style="color:var(--text-muted)">Dev Backend</span></span>
  <span style="color:var(--fe)"><svg class="ic" aria-hidden="true"><use href="#i-dev-frontend"/></svg><span style="color:var(--text-muted)">Dev Frontend</span></span>
  <span style="color:var(--qa)"><svg class="ic" aria-hidden="true"><use href="#i-qa"/></svg><span style="color:var(--text-muted)">QA</span></span>
  <span style="color:var(--out)"><svg class="ic" aria-hidden="true"><use href="#i-outro"/></svg><span style="color:var(--text-muted)">Outro</span></span>
</div>

<div class="corpo">
  <main id="canvas" aria-label="Fluxo da sessão" aria-busy="true">
    <button type="button" class="btn peq btn-lista" id="btn-lista" aria-controls="resumo" aria-expanded="false" hidden>Ver como lista</button>
    <div class="grafo" id="grafo" hidden>
      <svg id="arestas" aria-hidden="true"></svg>
      <div id="decor"></div>
      <div id="nos"></div>
    </div>
    <div class="estado ativo" id="estado"></div>
  </main>

  <aside class="painel" id="painel" role="dialog" aria-modal="false" aria-labelledby="painel-titulo"></aside>
</div>

<section class="resumo sr-only" id="resumo" aria-labelledby="resumo-titulo">
  <h2 id="resumo-titulo" style="font-size:16px;margin:0 0 8px">Resumo do fluxo</h2>
  <ol id="resumo-lista" style="margin:0;padding-left:20px;line-height:1.6"></ol>
</section>
<div class="sr-only" aria-live="polite" id="anuncios"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
